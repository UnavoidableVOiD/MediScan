[project]
name = "mediscan"
version = "0.1.0"
description = "MediScan monorepo - clinical report extraction, risk assessment and consultation platform"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
  "packages/clinical",
  "apps/api",
  "apps/worker",
  "apps/inference",
  "apps/llm_gateway",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "pre-commit>=3.8",
]

# ---------- shared tool config (every member inherits) ----------
[tool.ruff]
line-length = 100
extend-exclude = ["legacy", "docs/src"]   # legacy is read-only reference; docs/src is a prose-heavy generator
target-version = "py312"
src = ["packages/clinical/src", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "SIM", "RUF"]
# T20 = no print(); S = bandit security checks; B = bugbear
ignore = ["S101"]           # assert is fine in tests
per-file-ignores = { "**/tests/**" = ["S", "T20"] }

[tool.mypy]
python_version = "3.12"
exclude = ["legacy/"]
strict = true
warn_unreachable = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
norecursedirs = ["legacy", ".venv", "node_modules"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs docker services (postgres, redis, minio)",
  "golden: runs the OCR golden set (slow)",
]
