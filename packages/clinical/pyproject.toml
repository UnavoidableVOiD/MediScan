[project]
name = "clinical"
version = "0.1.0"
description = "Pure clinical domain: analytes (LOINC), units, observations, reference ranges, rules. No framework dependencies."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical"]

[tool.mypy]
strict = true
