# Development infrastructure only. Application services run from source (uv run / npm run dev).
# Start: make infra-up      Stop: make infra-down      Data: infra/.volumes (gitignored)
name: mediscan-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediscan}
      POSTGRES_USER: ${POSTGRES_USER:-mediscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: [".volumes/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediscan}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio-change-me}
    ports: ["9000:9000", "9001:9001"]
    volumes: [".volumes/minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minio} ${S3_SECRET_KEY:-minio-change-me} &&
      mc mb -p local/${S3_BUCKET_REPORTS:-mediscan-reports} &&
      mc mb -p local/${S3_BUCKET_BUNDLES:-mediscan-bundles} &&
      echo buckets ready"

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [".volumes/ollama:/root/.ollama"]
    # first run: docker compose -f infra/docker-compose.yml exec ollama ollama pull llama3.2
