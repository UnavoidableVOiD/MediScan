[project]
name = "mediscan-worker"
version = "0.1.0"
description = "Celery worker: runs the report pipeline (extract -> normalise -> rules -> assess -> explain)"
requires-python = ">=3.12"
dependencies = ["celery[redis]>=5.4", "httpx>=0.27", "pydantic-settings>=2.4", "structlog>=24", "clinical"]

[tool.uv.sources]
clinical = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
