[project]
name = "mediscan-api"
version = "0.1.0"
description = "Django API: identity, reports, consultation, billing, administration, audit"
requires-python = ">=3.12"
dependencies = ["django>=5.1,<6", "djangorestframework>=3.15", "djangorestframework-simplejwt>=5.3", "drf-spectacular>=0.27", "django-cors-headers>=4.4", "psycopg[binary]>=3.2", "django-storages[s3]>=1.14", "celery[redis]>=5.4", "pydantic-settings>=2.4", "structlog>=24", "clinical"]

[tool.uv.sources]
clinical = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
