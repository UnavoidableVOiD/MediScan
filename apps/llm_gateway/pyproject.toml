[project]
name = "mediscan-llm_gateway"
version = "0.1.0"
description = "FastAPI LLM gateway: provider adapter, RAG with citations, versioned prompts, output validation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4", "httpx>=0.27", "structlog>=24", "clinical"]

[tool.uv.sources]
clinical = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
