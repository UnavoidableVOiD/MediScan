[project]
name = "mediscan-inference"
version = "0.1.0"
description = "FastAPI inference service: versioned model bundles with manifests, NotAssessable semantics"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4", "scikit-learn>=1.5", "xgboost>=2.1", "joblib>=1.4", "numpy>=2", "pandas>=2.2", "structlog>=24", "clinical"]

[tool.uv.sources]
clinical = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
