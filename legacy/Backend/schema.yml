components:
  schemas:
    AdminCreate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 128
        password:
          type: string
          writeOnly: true
      required:
      - email
      - first_name
      - last_name
      - password
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoleEnum'
        specialization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SpecializationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        is_verified:
          type: boolean
        doctor_status:
          $ref: '#/components/schemas/DoctorStatusEnum'
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        created_at:
          type: string
          format: date-time
          readOnly: true
        license_info:
          type: string
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - license_info
    BlankEnum:
      enum:
      - ''
    DoctorComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        report:
          type: integer
        doctor:
          type: integer
          readOnly: true
        comment:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comment
      - created_at
      - doctor
      - id
      - report
      - updated_at
    DoctorLicense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        license_number:
          type: string
          maxLength: 100
        license_file:
          type: string
          format: uri
        supporting_documents:
          type: array
          items:
            $ref: '#/components/schemas/SupportingDocument'
          readOnly: true
        supporting_documents_upload:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
          description: Upload multiple verification documents.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusDcaEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
          nullable: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - license_file
      - license_number
      - rejection_reason
      - status
      - submitted_at
      - supporting_documents
      - updated_at
    DoctorPatientLink:
