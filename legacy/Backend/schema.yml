      - GENERAL_PHYSICIAN
      - CARDIOLOGIST
      - DERMATOLOGIST
      - NEUROLOGIST
      - ORTHOPEDIC
      - PEDIATRICIAN
      - OTHER
      type: string
      description: |-
        * `GENERAL_PHYSICIAN` - General Physician
        * `CARDIOLOGIST` - Cardiologist
        * `DERMATOLOGIST` - Dermatologist
        * `NEUROLOGIST` - Neurologist
        * `ORTHOPEDIC` - Orthopedic
        * `PEDIATRICIAN` - Pediatrician
        * `OTHER` - Other
    StatusDcaEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
    SupportingDocument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - file
      - id
      - uploaded_at
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TypeEnum:
      enum:
      - register
      - login
      type: string
      description: |-
        * `register` - register
        * `login` - login
    User:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        phone_number:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        specialization:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SpecializationEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        doctor_status:
          allOf:
          - $ref: '#/components/schemas/DoctorStatusEnum'
          readOnly: true
      required:
      - doctor_status
      - email
      - first_name
      - last_name
      - phone_number
      - role
    VerifyOTP:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
        type:
          $ref: '#/components/schemas/TypeEnum'
      required:
      - email
      - otp
      - type
  securitySchemes:
    JWTCookieAuthentication:
      type: apiKey
      in: cookie
      name: access
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
